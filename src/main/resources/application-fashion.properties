# ====================================================================
# 穿搭模块：衣橱识别/导入、语义检索(Qdrant)、公共参考库、试衣、搭配推荐、知识 RAG
# ====================================================================

# 穿搭多 Agent 图运行时（spring-ai-alibaba-graph）：默认启用，作为穿搭管道唯一权威来源。
# 关闭（FASHION_GRAPH_ENABLED=false）后 fashion_consultant 仅返回安全兜底，不出搭配方案。
app.fashion.graph.enabled=${FASHION_GRAPH_ENABLED:true}
# 图是否权威（负责对话持久化/画像写入）：旧 AgentCoordinator 已删除，权威模式为默认。
app.fashion.graph.shadow=${FASHION_GRAPH_SHADOW:false}
# critic 驳回回环与图内自主工具循环默认关闭，保持线上口径稳定；按需开启。
app.fashion.graph.critic-loop.enabled=${FASHION_GRAPH_CRITIC_LOOP_ENABLED:false}
app.fashion.graph.tool-loop.enabled=${FASHION_GRAPH_TOOL_LOOP_ENABLED:false}
# HITL 人工确认：命中付费操作意图（生成试穿图/图片等）的请求在 confirm 节点前中断，等用户确认后恢复。
app.fashion.graph.hitl.enabled=${FASHION_GRAPH_HITL_ENABLED:false}
# 执行预算护栏（默认关闭）：单次 run 的模型调用次数 / Token 总量 / 总 deadline / Critic 节点 deadline。
app.fashion.graph.budget.enabled=${FASHION_GRAPH_BUDGET_ENABLED:false}
app.fashion.graph.budget.max-model-calls=${FASHION_GRAPH_BUDGET_MAX_MODEL_CALLS:12}
app.fashion.graph.budget.max-total-tokens=${FASHION_GRAPH_BUDGET_MAX_TOTAL_TOKENS:30000}
app.fashion.graph.budget.run-deadline=${FASHION_GRAPH_BUDGET_RUN_DEADLINE:60s}
app.fashion.graph.budget.critic-deadline=${FASHION_GRAPH_BUDGET_CRITIC_DEADLINE:20s}

# 衣橱识别草稿：用户不确认时自动清理；每次查看、修改或生成新版本都会续期。
app.fashion.ingestion.draft-lifetime=${FASHION_INGESTION_DRAFT_LIFETIME:30m}
# Photo-to-wardrobe cutout jobs reuse the bounded image worker pool and are dispatched from durable MySQL state.
app.fashion.ingestion.dispatch-interval=${FASHION_INGESTION_DISPATCH_INTERVAL:3s}

# 虚拟试衣使用同一有界图片工作池，但提供商时限比普通改图更长。
app.fashion.tryon.provider-timeout=${FASHION_TRYON_PROVIDER_TIMEOUT:150s}
app.fashion.tryon.dispatch-interval=${FASHION_TRYON_DISPATCH_INTERVAL:3s}

# 虚拟试衣 provider 切换：reference-image（默认，通用图片编辑）或 mcp（外部试衣 MCP Server）。
app.fashion.tryon.provider=${FASHION_TRYON_PROVIDER:reference-image}
# MCP 模式下的工具名
app.fashion.tryon.mcp.tool-name=${FASHION_TRYON_MCP_TOOL_NAME:virtual_try_on}
# MCP 调用超时（默认复用 provider-timeout，可单独覆盖）
app.fashion.tryon.mcp.timeout=${FASHION_TRYON_MCP_TIMEOUT:150s}

app.fashion.outfit-recommendation.enabled=${FASHION_OUTFIT_RECOMMENDATION_ENABLED:true}
app.fashion.outfit-recommendation.render-provider=${FASHION_OUTFIT_RENDER_PROVIDER:image-edit}
app.fashion.outfit-recommendation.public-candidate-limit=${FASHION_OUTFIT_PUBLIC_CANDIDATE_LIMIT:20}
app.fashion.outfit-recommendation.wardrobe-candidates-per-role=${FASHION_OUTFIT_WARDROBE_CANDIDATES_PER_ROLE:8}
app.fashion.outfit-recommendation.minimum-companion-similarity=${FASHION_OUTFIT_MINIMUM_COMPANION_SIMILARITY:0.30}
app.fashion.outfit-recommendation.evidence-weight=${FASHION_OUTFIT_EVIDENCE_WEIGHT:0.30}
app.fashion.outfit-recommendation.occasion-weight=${FASHION_OUTFIT_OCCASION_WEIGHT:0.15}
app.fashion.outfit-recommendation.season-weather-weight=${FASHION_OUTFIT_SEASON_WEATHER_WEIGHT:0.15}
app.fashion.outfit-recommendation.color-weight=${FASHION_OUTFIT_COLOR_WEIGHT:0.15}
app.fashion.outfit-recommendation.style-weight=${FASHION_OUTFIT_STYLE_WEIGHT:0.10}
app.fashion.outfit-recommendation.fit-formality-weight=${FASHION_OUTFIT_FIT_FORMALITY_WEIGHT:0.05}
app.fashion.outfit-recommendation.preference-weight=${FASHION_OUTFIT_PREFERENCE_WEIGHT:0.05}
app.fashion.outfit-recommendation.novelty-weight=${FASHION_OUTFIT_NOVELTY_WEIGHT:0.05}
app.fashion.outfit-recommendation.provider-timeout=${FASHION_OUTFIT_PROVIDER_TIMEOUT:150s}
app.fashion.outfit-recommendation.dispatch-interval=${FASHION_OUTFIT_DISPATCH_INTERVAL:3s}

# 衣橱语义检索：独立百炼 Embedding + Qdrant。默认关闭；开启后仍与公共参考库严格分开。
# qwen3-rerank 是召回后的可选重排模型，第一版不启用，避免额外延迟和调用费用。
app.fashion.semantic.enabled=${FASHION_SEMANTIC_ENABLED:false}
app.fashion.semantic.embedding-base-url=${FASHION_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
app.fashion.semantic.embedding-api-key=${FASHION_EMBEDDING_API_KEY:${DASHSCOPE_API_KEY:${TTS_API_KEY:not-configured}}}
app.fashion.semantic.embedding-model=${FASHION_EMBEDDING_MODEL:text-embedding-v4}
app.fashion.semantic.embedding-dimensions=${FASHION_EMBEDDING_DIMENSIONS:1024}
app.fashion.semantic.qdrant-host=${QDRANT_HOST:127.0.0.1}
app.fashion.semantic.qdrant-port=${QDRANT_GRPC_PORT:6334}
app.fashion.semantic.qdrant-api-key=${QDRANT_API_KEY:}
app.fashion.semantic.qdrant-tls=${QDRANT_TLS:false}
app.fashion.semantic.collection-name=${QDRANT_COLLECTION:ykd_fashion_wardrobe_v1}
app.fashion.semantic.similarity-threshold=${FASHION_SEMANTIC_THRESHOLD:0.25}
app.fashion.semantic.candidate-multiplier=${FASHION_SEMANTIC_CANDIDATE_MULTIPLIER:5}
app.fashion.semantic.dispatch-interval=${FASHION_SEMANTIC_DISPATCH_INTERVAL:5s}
app.fashion.semantic.processing-lease=${FASHION_SEMANTIC_PROCESSING_LEASE:2m}
app.fashion.semantic.batch-size=${FASHION_SEMANTIC_BATCH_SIZE:8}
app.fashion.semantic.worker-threads=${FASHION_SEMANTIC_WORKER_THREADS:2}
app.fashion.semantic.queue-capacity=${FASHION_SEMANTIC_QUEUE_CAPACITY:50}
app.fashion.semantic.max-attempts=${FASHION_SEMANTIC_MAX_ATTEMPTS:5}

# 平台公共穿搭参考库。默认关闭，启用后仍与用户个人衣橱严格分开。
app.fashion.reference.enabled=${FASHION_REFERENCE_ENABLED:false}
# 导入器只在显式开启时运行；正常启动不会扫描本地采集目录。
app.fashion.reference.import-enabled=${FASHION_REFERENCE_IMPORT_ENABLED:false}
app.fashion.reference.annotation-file=${FASHION_REFERENCE_ANNOTATION_FILE:}
app.fashion.reference.image-directory=${FASHION_REFERENCE_IMAGE_DIRECTORY:}
app.fashion.reference.import-limit=${FASHION_REFERENCE_IMPORT_LIMIT:3}
app.fashion.reference.publish-imported=${FASHION_REFERENCE_PUBLISH_IMPORTED:false}
# First import wave keeps tops, bottoms and outerwear. Shoes remain in the raw annotation JSON for later processing.
app.fashion.reference.included-categories=${FASHION_REFERENCE_INCLUDED_CATEGORIES:TOP,BOTTOM,OUTERWEAR}
# Optional JSONL reconciliation. A file that exists under cutout-image-directory wins over a stale PENDING job state.
app.fashion.reference.cutout-job-file=${FASHION_REFERENCE_CUTOUT_JOB_FILE:}
app.fashion.reference.cutout-manifest-file=${FASHION_REFERENCE_CUTOUT_MANIFEST_FILE:}
app.fashion.reference.cutout-image-directory=${FASHION_REFERENCE_CUTOUT_IMAGE_DIRECTORY:}

# 穿搭知识 RAG 检索提供方：mysql=MySQL FULLTEXT（默认降级）/ ragflow=RAGFlow 向量检索。
# 选择 ragflow 时，API Key 与 Dataset ID 通过 RAGFLOW_API_KEY / RAGFLOW_DATASET_ID 注入。
app.fashion.rag.provider=${FASHION_RAG_PROVIDER:mysql}
app.fashion.rag.ragflow.base-url=${RAGFLOW_BASE_URL:http://127.0.0.1:9380}
app.fashion.rag.ragflow.api-key=${RAGFLOW_API_KEY:}
app.fashion.rag.ragflow.dataset-id=${RAGFLOW_DATASET_ID:}
app.fashion.rag.ragflow.top-k=${RAGFLOW_TOP_K:5}
app.fashion.rag.ragflow.retrieval-page-size=${RAGFLOW_RETRIEVAL_PAGE_SIZE:50}
app.fashion.rag.ragflow.similarity-threshold=${RAGFLOW_SIMILARITY_THRESHOLD:0.2}
app.fashion.rag.ragflow.vector-similarity-weight=${RAGFLOW_VECTOR_SIMILARITY_WEIGHT:0.3}
# Rerank 语义精排：留空关闭；开启后需配置 rerank 模型标识（RAGFlow 实例名@模型名）与独立阈值
app.fashion.rag.ragflow.rerank-id=${RAGFLOW_RERANK_ID:}
app.fashion.rag.ragflow.rerank-similarity-threshold=${RAGFLOW_RERANK_SIMILARITY_THRESHOLD:0.0}
app.fashion.rag.ragflow.timeout=${RAGFLOW_TIMEOUT:15s}
# 多路召回 + RRF 融合：开启后并行检索 3 路（HyDE/子查询/中文映射）按 1/(60+rank) 融合。
# 修正 P3 V4 round-robin 退步问题，按信息检索标准 RRF 加权融合。
# 2026-08-23 评测结论：当前 naive chunk 配置下退步（baseline 21→10%，最优 31.58→14%），默认关闭。
# 代码保留待 outfit 级 chunking 重做后复测。
app.fashion.rag.ragflow.multi-route-enabled=${RAGFLOW_MULTI_ROUTE_ENABLED:false}
app.fashion.rag.ragflow.multi-route-rrf-k=${RAGFLOW_MULTI_ROUTE_RRF_K:60}
# HyDE（假设性 outfit 描述扩展）作为检索词主锚点。关闭时走旧拼接逻辑。
# 2026-08-23 评测：单路 vw=0.3/vw=0.7 均退步（baseline 21→12-16%），默认关闭待 outfit 级 chunking 后复测。
app.fashion.rag.ragflow.hyde-enabled=${RAGFLOW_HYDE_ENABLED:false}
# 检索多样性（相关性优先，池内加权随机）：关闭则恢复确定性 top-k。
app.fashion.rag.diversity.enabled=${FASHION_RAG_DIVERSITY_ENABLED:true}
app.fashion.rag.diversity.candidate-pool=${FASHION_RAG_DIVERSITY_POOL:15}
app.fashion.rag.diversity.min-score=${FASHION_RAG_DIVERSITY_MIN_SCORE:0}

# ====================================================================
# 服装抠图 provider 切换：reference-image（默认，通用图片编辑）或 mcp（外部抠图 MCP Server）。
# ====================================================================
app.fashion.cutout.provider=${FASHION_CUTOUT_PROVIDER:reference-image}
app.fashion.cutout.provider-timeout=${FASHION_CUTOUT_PROVIDER_TIMEOUT:120s}
# MCP 模式下的工具名（抠图 / 草稿修订；修订工具名留空时回退到抠图工具名）
app.fashion.cutout.mcp.cutout-tool-name=${FASHION_CUTOUT_MCP_CUTOUT_TOOL_NAME:garment_cutout}
app.fashion.cutout.mcp.revise-tool-name=${FASHION_CUTOUT_MCP_REVISE_TOOL_NAME:garment_revise}
# MCP 调用超时（默认复用 provider-timeout，可单独覆盖）
app.fashion.cutout.mcp.timeout=${FASHION_CUTOUT_MCP_TIMEOUT:120s}

# ====================================================================
# 服装识别 provider 切换：chat-completions（默认，ChatCompletions 视觉模型）或 mcp（外部识别 MCP Server）。
# ====================================================================
app.fashion.analysis.provider=${FASHION_ANALYSIS_PROVIDER:chat-completions}
# MCP 模式下的工具名
app.fashion.analysis.mcp.tool-name=${FASHION_ANALYSIS_MCP_TOOL_NAME:wardrobe_photo_analysis}
# MCP 分析版本标识（持久化为候选 metadata）
app.fashion.analysis.mcp.prompt-version=${FASHION_ANALYSIS_MCP_PROMPT_VERSION:mcp-v1}
# MCP 调用超时（秒）
app.fashion.analysis.mcp.timeout-seconds=${FASHION_ANALYSIS_MCP_TIMEOUT_SECONDS:60}
