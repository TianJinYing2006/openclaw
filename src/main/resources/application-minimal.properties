# ====================================================================
# minimal Profile：仅穿搭管道，无媒体处理（图片/视频/ASR/TTS 全部关闭）
# 启动方式：--spring.profiles.active=minimal
# 仍保留：文字聊天、穿搭多 Agent 管道、天气/时间/提醒工具、持久化
# ====================================================================
app.ai.image-enabled=false
app.video.enabled=false
app.asr.enabled=false
app.tts.enabled=false
