spring.application.name=ykd-summer
server.port=${SERVER_PORT:8080}

# 默认加载仅存在于本机、且已被 Git 忽略的 application-local.properties。
spring.profiles.default=local
# 按功能域拆分：bot(iLink/管理/提醒)、media(图片/视频/ASR/TTS/OSS)、fashion(穿搭 RAG/语义/参考库/试衣)。
spring.config.import=classpath:application-bot.properties,classpath:application-media.properties,classpath:application-fashion.properties

# Spring AI 1.1.8 负责普通纯文本 Chat Completions，也是 Agent/Tool 的统一入口。
spring.ai.openai.base-url=${SPRING_AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
spring.ai.openai.api-key=${SPRING_AI_API_KEY:${DASHSCOPE_API_KEY:${TTS_API_KEY:not-configured}}}
spring.ai.openai.chat.completions-path=${SPRING_AI_CHAT_COMPLETIONS_PATH:/chat/completions}
spring.ai.openai.chat.options.model=${SPRING_AI_MODEL:${AI_MODEL:qwen3.7-plus}}
# MySQL 提供对话/画像/衣橱等持久化（默认开启，连接失败会明确报错）；Redis 仅缓存，可留空跳过。
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration,org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
app.persistence.enabled=${PERSISTENCE_ENABLED:true}
app.persistence.jdbc-url=${PERSISTENCE_JDBC_URL:jdbc:mysql://127.0.0.1:3306/ykd_summer?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
app.persistence.username=${PERSISTENCE_USERNAME:root}
app.persistence.password=${PERSISTENCE_PASSWORD:}
app.persistence.maximum-pool-size=${PERSISTENCE_MAXIMUM_POOL_SIZE:10}
app.persistence.connection-timeout=${PERSISTENCE_CONNECTION_TIMEOUT:5s}
app.persistence.redis.enabled=${PERSISTENCE_REDIS_ENABLED:false}
app.persistence.redis.host=${PERSISTENCE_REDIS_HOST:127.0.0.1}
app.persistence.redis.port=${PERSISTENCE_REDIS_PORT:6379}
app.persistence.redis.password=${PERSISTENCE_REDIS_PASSWORD:}
app.persistence.redis.key-prefix=${PERSISTENCE_REDIS_KEY_PREFIX:ykd}
app.persistence.redis.message-dedup-ttl=${PERSISTENCE_REDIS_MESSAGE_DEDUP_TTL:24h}
management.endpoints.web.exposure.include=health,info
# AI 默认使用百炼 OpenAI Chat Completions 兼容接口；密钥只能通过环境变量或本机忽略配置注入。
app.ai.enabled=${AI_ENABLED:true}
app.ai.model=${AI_MODEL:qwen3.7-plus}
# 穿搭多 Agent 管道专用快速模型；留空回退 app.ai.model
app.ai.fashion-model=${AI_FASHION_MODEL:qwen3.7-flash}
app.ai.embedding.base-url=${AI_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
app.ai.embedding.api-key=${AI_EMBEDDING_API_KEY:not-configured}
app.ai.embedding-model=${AI_EMBEDDING_MODEL:text-embedding-v3}
app.ai.system-prompt=${AI_SYSTEM_PROMPT:}
app.ai.max-completion-tokens=${AI_MAX_COMPLETION_TOKENS:600}
app.ai.reasoning-effort=${AI_REASONING_EFFORT:medium}
# 仅当已单独验证当前供应商支持 /v1/responses 时才开启；百炼 Qwen 默认走 Chat Completions。
app.ai.responses-enabled=${AI_RESPONSES_ENABLED:false}
app.ai.timeout=${AI_TIMEOUT:120s}
app.ai.max-agent-rounds=${AI_MAX_AGENT_ROUNDS:4}
app.ai.max-memory-messages=${AI_MAX_MEMORY_MESSAGES:20}
app.ai.memory-idle-timeout=${AI_MEMORY_IDLE_TIMEOUT:2h}
app.ai.max-memory-users=${AI_MAX_MEMORY_USERS:10000}
# 所有 OpenAI 兼容文字模型共用的 token 预算层；计数仅存内存，重启清空。
app.ai.usage.daily-token-limit=${AI_USAGE_DAILY_TOKEN_LIMIT:30000}
app.ai.usage.simple-max-output-tokens=${AI_USAGE_SIMPLE_MAX_OUTPUT_TOKENS:300}
app.ai.usage.standard-max-output-tokens=${AI_USAGE_STANDARD_MAX_OUTPUT_TOKENS:${AI_MAX_COMPLETION_TOKENS:600}}
app.ai.usage.complex-max-output-tokens=${AI_USAGE_COMPLEX_MAX_OUTPUT_TOKENS:1000}
app.ai.usage.max-estimated-input-tokens=${AI_USAGE_MAX_ESTIMATED_INPUT_TOKENS:12000}
app.ai.usage.simple-prompt-characters=${AI_USAGE_SIMPLE_PROMPT_CHARACTERS:80}
app.ai.usage.max-tracked-users=${AI_USAGE_MAX_TRACKED_USERS:10000}
app.ai.usage.estimated-tokens-per-image=${AI_USAGE_ESTIMATED_TOKENS_PER_IMAGE:1000}
# 微信服装 Agent 默认不做隐藏的联网补充检索；接入实时知识源时按具体 Tool 显式开启。
app.ai.realtime-augmentation.enabled=${AI_REALTIME_AUGMENTATION_ENABLED:false}
app.ai.realtime-augmentation.timeout=${AI_REALTIME_AUGMENTATION_TIMEOUT:15s}
app.ai.realtime-augmentation.worker-threads=${AI_REALTIME_AUGMENTATION_WORKERS:8}
app.ai.realtime-augmentation.queue-capacity=${AI_REALTIME_AUGMENTATION_QUEUE_CAPACITY:64}
app.ai.realtime-augmentation.max-query-characters=${AI_REALTIME_AUGMENTATION_MAX_QUERY_CHARACTERS:320}
app.ai.realtime-augmentation.max-specialized-result-characters=${AI_REALTIME_AUGMENTATION_MAX_SPECIALIZED_RESULT_CHARACTERS:1200}
app.ai.realtime-augmentation.max-web-result-characters=${AI_REALTIME_AUGMENTATION_MAX_WEB_RESULT_CHARACTERS:1200}
app.ai.realtime-augmentation.max-combined-result-characters=${AI_REALTIME_AUGMENTATION_MAX_COMBINED_RESULT_CHARACTERS:2400}
app.ai.realtime-augmentation.cache-ttl=${AI_REALTIME_AUGMENTATION_CACHE_TTL:30s}
app.ai.realtime-augmentation.max-cache-entries=${AI_REALTIME_AUGMENTATION_MAX_CACHE_ENTRIES:500}
app.ai.realtime-augmentation.eligible-tools=${AI_REALTIME_AUGMENTATION_ELIGIBLE_TOOLS:}
# 原始文件的 Responses 备用通道，与 spring.ai.openai 的聊天/视觉通道彻底分开。
app.ai.responses.base-url=${AI_RESPONSES_BASE_URL:https://api.openai.com/v1}
app.ai.responses.api-key=${AI_RESPONSES_API_KEY:not-configured}
app.ai.responses.model=${AI_RESPONSES_MODEL:not-configured}
# AI 联调链路日志：本地默认开启；部署时设置 AI_TRACE_ENABLED=false。
app.ai.trace.enabled=${AI_TRACE_ENABLED:true}
app.ai.trace.max-text-length=${AI_TRACE_MAX_TEXT_LENGTH:500}
# 联网搜索工具密钥。
bocha.api-key=${BOCHA_API_KEY:}
uapis.api-key=${UAPIS_API_KEY:}

# 网页搜索 provider 切换：bocha（默认）或 mcp
app.web-search.provider=${WEB_SEARCH_PROVIDER:bocha}
# MCP 模式下的工具名
app.web-search.tool-name=${WEB_SEARCH_MCP_TOOL_NAME:web_search}
app.web-search.max-results=${WEB_SEARCH_MAX_RESULTS:8}

# 天气 provider 切换：uapis（默认，uapis.cn 公共 API）或 mcp（外部天气 MCP Server）。
app.weather.provider=${WEATHER_PROVIDER:uapis}
# MCP 模式下的工具名
app.weather.mcp.tool-name=${WEATHER_MCP_TOOL_NAME:get_weather}
