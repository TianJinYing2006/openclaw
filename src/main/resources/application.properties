spring.application.name=ykd-summer

# Spring AI 1.1.8 负责普通纯文本 Chat Completions，也是后续 Agent/Tool 的统一入口。
# base-url 不带 /v1；Spring AI 会通过下面的 completions-path 追加完整协议路径。
# 默认复用 Responses 的 AI_API_KEY，但允许用 SPRING_AI_API_KEY 单独覆盖。
spring.ai.openai.base-url=${SPRING_AI_BASE_URL:https://moosecloud.cc}
spring.ai.openai.api-key=${SPRING_AI_API_KEY:${AI_API_KEY:not-configured}}
spring.ai.openai.chat.completions-path=${SPRING_AI_CHAT_COMPLETIONS_PATH:/v1/chat/completions}
spring.ai.openai.chat.options.model=${SPRING_AI_MODEL:${AI_MODEL:gpt-5.6-sol}}
management.endpoints.web.exposure.include=health,info

# 是否连接 iLink。默认关闭，避免普通测试或误启动时直接联网。
# 开启方法二选一：环境变量 ILINK_ENABLED=true，或启动参数 --ilink.enabled=true。
ilink.enabled=${ILINK_ENABLED:false}
# 腾讯 iLink 服务地址及通道版本，通常保持默认值。
ilink.base-url=https://ilinkai.weixin.qq.com
ilink.channel-version=1.0.0
# 早期固定回复 Demo 的兼容配置；当前扩充版普通消息已由 ILinkReplyService 分流。
# 保留它是为了旧测试/配置兼容，不代表当前所有文字还会固定回复。
# .properties 对非 ASCII 字符的处理在不同加载方式下可能有差异，Unicode 转义可避免中文乱码。
ilink.fixed-reply=${ILINK_FIXED_REPLY:\u4F60\u597D\uFF0C\u6211\u5DF2\u7ECF\u6536\u5230\u4F60\u7684\u6587\u672C\u6D88\u606F\u3002}
# 保存登录 token 与 getupdates 游标。内容敏感，.ilink/ 已加入 .gitignore。
# 删除此文件相当于清除本地登录态，下次启动会重新生成扫码二维码。
ilink.session-file=${ILINK_SESSION_FILE:.ilink/session.properties}
ilink.text-queue-capacity=${ILINK_TEXT_QUEUE_CAPACITY:100}
ilink.image-queue-capacity=${ILINK_IMAGE_QUEUE_CAPACITY:10}
ilink.rate-limit.enabled=${ILINK_RATE_LIMIT_ENABLED:true}
ilink.rate-limit.window=${ILINK_RATE_LIMIT_WINDOW:30s}
ilink.rate-limit.max-users=${ILINK_RATE_LIMIT_MAX_USERS:10000}
ilink.rate-limit.limits.text=${ILINK_RATE_LIMIT_TEXT:20}
ilink.rate-limit.limits.voice=${ILINK_RATE_LIMIT_VOICE:10}
ilink.rate-limit.limits.image=${ILINK_RATE_LIMIT_IMAGE:5}
ilink.rate-limit.limits.file=${ILINK_RATE_LIMIT_FILE:5}
ilink.rate-limit.limits.video=${ILINK_RATE_LIMIT_VIDEO:2}

# AI 默认使用麋鹿云的 OpenAI Responses 兼容接口。密钥只能通过环境变量注入，不能写进源码。
app.ai.enabled=${AI_ENABLED:true}
# 麋鹿云当前的 gpt-5.6 通用别名可能返回 502，明确使用已验证可用的 Sol 路由。
app.ai.model=${AI_MODEL:gpt-5.6-sol}
# 普通聊天和多模态回答共用基础风格；默认值在 AiProperties 中，环境变量可按部署需要覆盖。
app.ai.system-prompt=${AI_SYSTEM_PROMPT:}
app.ai.max-completion-tokens=${AI_MAX_COMPLETION_TOKENS:600}
app.ai.reasoning-effort=${AI_REASONING_EFFORT:high}
app.ai.timeout=${AI_TIMEOUT:120s}
app.ai.max-memory-messages=${AI_MAX_MEMORY_MESSAGES:20}
app.ai.memory-idle-timeout=${AI_MEMORY_IDLE_TIMEOUT:2h}
app.ai.max-memory-users=${AI_MAX_MEMORY_USERS:10000}
app.ai.image-enabled=${AI_IMAGE_ENABLED:true}
app.ai.image-model=${AI_IMAGE_MODEL:gpt-image-2}
app.ai.image-size=${AI_IMAGE_SIZE:1024x1024}
app.ai.image-quality=${AI_IMAGE_QUALITY:medium}
# 生图服务与文字队列独立；默认最多等待 900 秒（15 分钟），调用层不自动重试。
app.ai.image-timeout=${AI_IMAGE_TIMEOUT:900s}

# 视频理解：腾讯视频由 SDK 下载解密，本机 FFmpeg 抽帧，再走上面的文字/图片 Responses API。
# 默认只处理 60 秒、20 MiB 以内的短视频；FFmpeg/ffprobe 可填写绝对路径或加入 PATH。
app.video.enabled=${VIDEO_ENABLED:true}
app.video.max-video-size=${VIDEO_MAX_SIZE:20MB}
app.video.max-duration=${VIDEO_MAX_DURATION:60s}
# 默认固定抽取 10 帧：最小值和最大值保持一致。
app.video.min-frames=${VIDEO_MIN_FRAMES:10}
app.video.max-frames=${VIDEO_MAX_FRAMES:10}
app.video.seconds-per-frame=${VIDEO_SECONDS_PER_FRAME:3}
app.video.max-frame-dimension=${VIDEO_MAX_FRAME_DIMENSION:768}
app.video.jpeg-quality=${VIDEO_JPEG_QUALITY:4}
app.video.max-total-frame-size=${VIDEO_MAX_TOTAL_FRAME_SIZE:5MB}
app.video.process-timeout=${VIDEO_PROCESS_TIMEOUT:2m}
app.video.ffmpeg-path=${FFMPEG_PATH:ffmpeg}
app.video.ffprobe-path=${FFPROBE_PATH:ffprobe}
app.video.queue-capacity=${VIDEO_QUEUE_CAPACITY:5}

# 视频音轨转写：FFmpeg 会先生成 16kHz 单声道 WAV，再用腾讯云一句话识别转成文字。
# SecretId/SecretKey 只能通过环境变量注入；没有配置时视频会自动降级为仅分析 10 帧画面。
app.asr.enabled=${TENCENT_ASR_ENABLED:true}
app.asr.secret-id=${TENCENTCLOUD_SECRET_ID:not-configured}
app.asr.secret-key=${TENCENTCLOUD_SECRET_KEY:not-configured}
app.asr.engine-service-type=${TENCENT_ASR_ENGINE:16k_zh}
app.asr.voice-format=wav
app.asr.endpoint=asr.tencentcloudapi.com
app.asr.region=${TENCENT_ASR_REGION:}
app.asr.timeout=${TENCENT_ASR_TIMEOUT:30s}
app.asr.max-audio-size=${TENCENT_ASR_MAX_AUDIO_SIZE:3MB}

# 阿里云百炼非实时语音合成：只有手打“语音：问题”时才会调用。
# 工作空间 Key 需要配套使用该空间自己的 cn-beijing.maas.aliyuncs.com API 地址。
app.tts.enabled=${ALIYUN_TTS_ENABLED:false}
app.tts.api-key=${DASHSCOPE_API_KEY:not-configured}
app.tts.base-url=${ALIYUN_TTS_BASE_URL:https://dashscope.aliyuncs.com/api/v1/services/audio/tts/SpeechSynthesizer}
app.tts.model=${ALIYUN_TTS_MODEL:cosyvoice-v3-flash}
# 默认音色；用户可在微信发送“设置音色：龙婉”按用户实时覆盖，重启后恢复此默认值。
app.tts.voice=${ALIYUN_TTS_VOICE:longanyang}
app.tts.format=${ALIYUN_TTS_FORMAT:mp3}
app.tts.sample-rate=${ALIYUN_TTS_SAMPLE_RATE:24000}
app.tts.timeout=${ALIYUN_TTS_TIMEOUT:90s}
app.tts.max-text-length=${ALIYUN_TTS_MAX_TEXT_LENGTH:600}
app.tts.max-audio-bytes=${ALIYUN_TTS_MAX_AUDIO_BYTES:10485760}

# OpenAI Java SDK 会在 base-url 后追加 responses，因此这里必须保留 /v1。
openai.base-url=${AI_BASE_URL:https://moosecloud.cc/v1}
openai.api-key=${AI_API_KEY:not-configured}

# 图片生成使用独立的 OpenAI Images API 兼容客户端，不影响上面的文字 Responses API。
# 密钥只放在启动环境变量 AI_IMAGE_API_KEY 中，禁止写入本文件或提交到 Git。
openai.image.base-url=${AI_IMAGE_BASE_URL:https://api.lk888.ai/v1}
openai.image.api-key=${AI_IMAGE_API_KEY:not-configured}

# TJY 文件生成链：上传文件在内存中缓存 5 分钟，下一条普通话与正文组合处理。
app.file.max-output-bytes=${FILE_MAX_OUTPUT_BYTES:20971520}

# 快递鸟物流查询（https://www.kdniao.com）
# EBusinessID（商户 ID）和 API Key（接口密钥）从快递鸟用户中心获取。
# 密钥优先从环境变量注入，避免写死在配置文件里。
kdniao.ebusiness-id=${KDNIAO_EBUSINESS_ID:1929624}
kdniao.api-key=${KDNIAO_API_KEY:47c7c0e9-6f1d-4b8d-809f-f6558f7033ed}

# 天行数据（https://www.tianapi.com）菜谱查询等数据类接口。
# API Key 请从天行数据个人中心获取，可放在 application-local.properties 中覆盖。
tianxing.api-key=${TIANXING_API_KEY:41379b2ebfe5c1ab125b26c623d84307}

# ExchangeRate-API（https://www.exchangerate-api.com）货币汇率转换。
# 免费版每月 1500 次请求。不配置时自动降级到 open.er-api.com 免费端点（每日更新一次）。
exchangerate.api-key=${EXCHANGERATE_API_KEY:b61e910fde7fef15a71e231f}

# Brave Search API（https://brave.com/search/api/）联网搜索。
# 免费注册获取 API Key，每月 2000 次免费查询。
brave.api-key=${BRAVE_API_KEY:not-configured}
