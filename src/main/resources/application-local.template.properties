# ====================================================================
# application-local.template.properties
# 本地运行配置模板——复制此文件并重命名为 application-local.properties，填入你的 Key
# ====================================================================

# ====================================================================
# 【必填】文字聊天 + 多模态识别 → 阿里云百炼（OpenAI 兼容接口）
# 注册：https://bailian.console.aliyun.com/
# ====================================================================
spring.ai.openai.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
spring.ai.openai.api-key=sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
spring.ai.openai.chat.completions-path=/chat/completions
spring.ai.openai.chat.options.model=qwen3.7-plus

# 业务层 model 回退值（与上面保持一致）
app.ai.model=qwen3.7-plus
# 图片视觉识别专用模型（如 qwen-vl-max），留空则与文字聊天共用同一模型
app.ai.vision-model=qwen-vl-max
app.ai.max-completion-tokens=8192
# 当前百炼配置仅使用 Chat Completions；不要开启，除非单独配置并验证支持 /v1/responses 的供应商。
app.ai.responses-enabled=false
# 只有准备启用上面的开关时才填写。它们不会复用 Qwen 的聊天地址、Key 或模型。
app.ai.responses.base-url=https://your-responses-provider.example/v1
app.ai.responses.api-key=sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
app.ai.responses.model=your-file-capable-model

# ====================================================================
# 【必填】iLink 微信机器人（首次启动会输出二维码，微信扫码登录）
# ====================================================================
ilink.enabled=true

# ====================================================================
# 【本地管理站】浏览器访问 http://127.0.0.1:8081/admin
# 密码和会话加密主密钥只存放本机 application-local.properties，不能提交 Git。
# session-encryption-key 必须是 32 字节随机值的 Base64；可用 PowerShell 生成：
# [Convert]::ToBase64String((1..32 | %% { Get-Random -Maximum 256 }))
# ====================================================================
app.admin.enabled=true
app.admin.username=admin
app.admin.password=replace-with-a-local-strong-password
app.admin.session-encryption-key=replace-with-32-byte-base64-key

# ====================================================================
# 【可选】本地 MySQL + Redis
# MySQL 是对话、任务、资产和用户的长期事实来源；Redis 只加速消息去重、限流和实时检索缓存。
# Redis 停止时，应用会自动回退到受限本地缓存；MySQL 必须保持运行，才能使用管理站持久化功能。
# ====================================================================
app.persistence.enabled=true
app.persistence.jdbc-url=jdbc:mysql://127.0.0.1:3306/ykd_summer?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
app.persistence.username=root
app.persistence.password=replace-with-your-local-mysql-password
app.persistence.redis.enabled=true
app.persistence.redis.host=127.0.0.1
app.persistence.redis.port=6379
app.persistence.redis.password=
app.persistence.redis.key-prefix=ykd
app.persistence.redis.message-dedup-ttl=24h

# ====================================================================
# 【可选】用户画像 Embedding 服务（百炼 text-embedding-v3）
# 与百炼 TTS / 图片生成共用同一个 API Key。
# ====================================================================
app.ai.embedding.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
app.ai.embedding.api-key=sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
app.ai.embedding-model=text-embedding-v3

# ====================================================================
# 【可选】衣橱语义检索：百炼 Embedding + 本机 Qdrant
# 先执行：docker compose -f infra/qdrant/compose.yml up -d
# 业务真数据仍在 MySQL，原图仍在 OSS；Qdrant 只保存可重建的文本向量和业务 ID。
# text-embedding-v4 适合当前短文本服装属性检索；qwen3-rerank 不是 Embedding 模型。
# ====================================================================
app.fashion.semantic.enabled=true
app.fashion.semantic.embedding-base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
app.fashion.semantic.embedding-api-key=${app.tts.api-key}
app.fashion.semantic.embedding-model=text-embedding-v4
app.fashion.semantic.embedding-dimensions=1024
app.fashion.semantic.qdrant-host=127.0.0.1
app.fashion.semantic.qdrant-port=6334
app.fashion.semantic.collection-name=ykd_fashion_wardrobe_v1
app.fashion.semantic.similarity-threshold=0.25

# 【可选】公共穿搭参考库。普通用户衣橱查询不会混入这些数据。
app.fashion.reference.enabled=true
# 仅在需要导入一批本地标注时临时打开，导入完成后立即改回 false。
app.fashion.reference.import-enabled=false
app.fashion.reference.annotation-file=D:/创意/穿搭图片标准化标注_1.0.0_前3张.json
app.fashion.reference.image-directory=D:/创意
app.fashion.reference.import-limit=3
# 仅供本地开发验收；正式发布前必须核验每张图片的使用权。
app.fashion.reference.publish-imported=false

# ====================================================================
# 【必填，因为 app.tts.enabled=true】百炼 TTS 语音合成
# 与上面百炼共用同一个 API Key
# ====================================================================
app.tts.enabled=true
app.tts.api-key=sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

# ====================================================================
# 【必填】图片生成/抠图 → OpenAI Images 兼容接口
# ====================================================================
openai.image.base-url=https://your-image-provider.example/v1
openai.image.api-key=sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
app.ai.image-model=gpt-image-2
app.ai.image-size=1024x1024
app.ai.image-quality=high
app.ai.image-timeout=120s

# ====================================================================
# 【可选】博查搜索 API（联网搜索）
# 注册：https://www.bochaai.com/
# ====================================================================
bocha.api-key=sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

# ====================================================================
# 【可选】uapis.cn API Key（QQ 用户查询等）
# ====================================================================
uapis.api-key=sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

# ====================================================================
# 【可选】地图服务
# ====================================================================
# 高德地图（地理编码 + 路线规划）https://lbs.amap.com/
amap.api-key=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
# 腾讯地图（POI 搜索）https://lbs.qq.com/
tencent.map.key=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxxx

# ====================================================================
# 【可选】快递鸟（物流查询，支持 1500+ 快递公司）
# 注册：https://www.kdniao.com/
# ====================================================================
kdniao.ebusiness-id=
kdniao.api-key=

# ====================================================================
# 【可选】天行数据（星座、股票、历史上的今天等）
# 注册：https://www.tianapi.com/
# ====================================================================
tianxing.api-key=

# ====================================================================
# 【可选】腾讯云语音识别 ASR（语音/视频转文字）
# 注册：https://console.cloud.tencent.com/asr
# ====================================================================
app.asr.secret-id=
app.asr.secret-key=

# ====================================================================
# 【可选】汇率查询 API
# ====================================================================
# exchangerate.api-key=

# ====================================================================
# 【可选】阿里云 OSS（图片持久化存储）
# 注册：https://console.aliyun.com/
# ====================================================================
oss.image.endpoint=
oss.image.access-key-id=
oss.image.access-key-secret=
oss.image.bucket-name=
oss.image.migrate-local-assets=false
oss.document.enabled=false
oss.document.prefix=ilink-bot/documents

# ====================================================================
# 【调试日志】（推荐开启，方便排查 AI 调用问题）
# ====================================================================
logging.level.com.example.ykdsummer.ai=DEBUG
# Spring AI HTTP 请求跟踪（排查工具调用/搜索问题时开启）
# logging.level.org.springframework.ai=TRACE
# logging.level.org.springframework.web=DEBUG
