# ====================================================================
# 微信机器人模块：iLink 协议 / 限流 / 管理站、回复分流、文件与会话
# ====================================================================

# 管理站与微信机器人分端口运行。开发者在被 Git 忽略的 application-local.properties
# 中提供 app.admin.password 和 app.admin.session-encryption-key 后再启用。
app.admin.enabled=${ADMIN_WEB_ENABLED:false}
app.admin.port=${ADMIN_WEB_PORT:8081}
app.admin.bind-address=${ADMIN_WEB_BIND_ADDRESS:127.0.0.1}
app.admin.username=${ADMIN_WEB_USERNAME:admin}
app.admin.password=${ADMIN_WEB_PASSWORD:}
app.admin.session-encryption-key=${ADMIN_SESSION_ENCRYPTION_KEY:}
app.admin.max-instances=${ADMIN_MAX_INSTANCES:20}

# 是否连接 iLink。默认关闭，避免普通测试或误启动时直接联网。
# 开启方法二选一：环境变量 ILINK_ENABLED=true，或启动参数 --ilink.enabled=true。
ilink.enabled=${ILINK_ENABLED:true}
# 腾讯 iLink 服务地址及通道版本，通常保持默认值。
ilink.base-url=https://ilinkai.weixin.qq.com
ilink.channel-version=1.0.0
# 早期固定回复 Demo 的兼容配置；保留它是为了旧测试/配置兼容。
ilink.fixed-reply=${ILINK_FIXED_REPLY:\u4F60\u597D\uFF0C\u6211\u5DF2\u7ECF\u6536\u5230\u4F60\u7684\u6587\u672C\u6D88\u606F\u3002}
# 保存登录 token 与 getupdates 游标。内容敏感，.ilink/ 已加入 .gitignore。
ilink.session-file=${ILINK_SESSION_FILE:.ilink/session.properties}
ilink.text-queue-capacity=${ILINK_TEXT_QUEUE_CAPACITY:100}
ilink.image-queue-capacity=${ILINK_IMAGE_QUEUE_CAPACITY:10}
ilink.rate-limit.enabled=${ILINK_RATE_LIMIT_ENABLED:true}
ilink.rate-limit.window=${ILINK_RATE_LIMIT_WINDOW:30s}
ilink.rate-limit.max-users=${ILINK_RATE_LIMIT_MAX_USERS:10000}
ilink.rate-limit.limits.text=${ILINK_RATE_LIMIT_TEXT:20}
ilink.rate-limit.limits.voice=${ILINK_RATE_LIMIT_VOICE:10}
ilink.rate-limit.limits.image=${ILINK_RATE_LIMIT_IMAGE:5}
ilink.rate-limit.limits.file=${ILINK_RATE_LIMIT_FILE:5}
ilink.rate-limit.limits.video=${ILINK_RATE_LIMIT_VIDEO:2}

# 面向用户的长文本分流：只对最终微信回复生效，先征询用户后才发送全文或 TXT。
app.reply.long-text.enabled=${LONG_TEXT_OUTPUT_ENABLED:true}
app.reply.long-text.threshold-characters=${LONG_TEXT_OUTPUT_THRESHOLD_CHARACTERS:1800}
app.reply.long-text.pending-ttl=${LONG_TEXT_OUTPUT_PENDING_TTL:10m}
app.reply.long-text.max-pending-users=${LONG_TEXT_OUTPUT_MAX_PENDING_USERS:10000}

# TJY 文件生成链：上传文件在内存中缓存 5 分钟，下一条普通话与正文组合处理。
app.file.max-output-bytes=${FILE_MAX_OUTPUT_BYTES:20971520}

# 微信提醒：固定文字提醒和“到点重新唤起 Agent”的任务都保存在 MySQL。
# contextToken 由用户最近一条微信消息刷新；Agent 任务默认租约留足 15 分钟，避免重复认领。
app.reminder.enabled=${REMINDER_ENABLED:true}
app.reminder.zone-id=${REMINDER_ZONE_ID:Asia/Shanghai}
app.reminder.poll-interval=${REMINDER_POLL_INTERVAL:15s}
app.reminder.processing-lease=${REMINDER_PROCESSING_LEASE:15m}
app.reminder.context-retry-interval=${REMINDER_CONTEXT_RETRY_INTERVAL:1m}
app.reminder.batch-size=${REMINDER_BATCH_SIZE:20}
app.reminder.worker-threads=${REMINDER_WORKER_THREADS:4}
app.reminder.queue-capacity=${REMINDER_QUEUE_CAPACITY:100}
app.reminder.max-delivery-attempts=${REMINDER_MAX_DELIVERY_ATTEMPTS:3}
