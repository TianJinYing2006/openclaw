# ====================================================================
# production Profile：全功能 + 持久化
# 启动方式：--spring.profiles.active=production
# 持久化默认已开启，MySQL 连接失败会在启动时明确报错。
# ====================================================================
ilink.enabled=true
app.ai.image-enabled=true
app.video.enabled=true
app.asr.enabled=true
app.tts.enabled=true
# 联调链路日志默认关闭，需要时用环境变量 AI_TRACE_ENABLED=true 打开。
app.ai.trace.enabled=${AI_TRACE_ENABLED:false}
