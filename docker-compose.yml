name: wechatbot

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wechatbot}
    ports:
      - "${MYSQL_PORT:-127.0.0.1:3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.14.1
    ports:
      - "${QDRANT_HTTP_PORT:-127.0.0.1:6333}:6333"
      - "${QDRANT_GRPC_PORT:-127.0.0.1:6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/6333 && echo ok || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  mcp-server:
    build:
      context: ./mcp-server
    environment:
      # 容器内需监听 0.0.0.0 才能被 app 容器访问；对外仅通过本地回环端口映射暴露。
      MCP_SERVER_HOST: 0.0.0.0
      MCP_SERVER_PORT: "8090"
      # 与 app 共享的鉴权令牌：设置后 MCP Server 要求 Authorization: Bearer <token>。
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      ARK_API_KEY: ${ARK_API_KEY:-}
      BOCHA_API_KEY: ${BOCHA_API_KEY:-}
    ports:
      # 默认只映射到宿主机 127.0.0.1，避免局域网/公网直连 MCP Server。
      - "${MCP_SERVER_PORT:-127.0.0.1:8090}:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket,sys; s=socket.create_connection(('127.0.0.1',8090),3); s.close()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
    depends_on:
      mysql:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    environment:
      SPRING_AI_OPENAI_API_KEY: ${DASHSCOPE_API_KEY:-}
      SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL: ${SPRING_AI_MODEL:-qwen3.7-plus}
      ILINK_ENABLED: ${ILINK_ENABLED:-false}
      PERSISTENCE_ENABLED: "true"
      PERSISTENCE_JDBC_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-wechatbot}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      PERSISTENCE_USERNAME: root
      PERSISTENCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      PERSISTENCE_REDIS_ENABLED: "true"
      PERSISTENCE_REDIS_HOST: redis
      QDRANT_HOST: qdrant
      APP_FASHION_SEMANTIC_ENABLED: ${FASHION_SEMANTIC_ENABLED:-false}
      APP_FASHION_REFERENCE_ENABLED: ${FASHION_REFERENCE_ENABLED:-false}
      APP_ADMIN_ENABLED: ${APP_ADMIN_ENABLED:-true}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      # 管理后台不提供默认密码：未在 .env 显式设置强密码则 compose 直接报错，避免 "change-me" 上生产。
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?APP_ADMIN_PASSWORD is required - set a strong password in .env}
      APP_ADMIN_SESSION_ENCRYPTION_KEY: ${APP_ADMIN_SESSION_ENCRYPTION_KEY:-}
      # 穿搭多 Agent 图运行时（默认开启）；关闭后 fashion_consultant 仅返回安全兜底。
      FASHION_GRAPH_ENABLED: ${FASHION_GRAPH_ENABLED:-true}
      APP_SECURITY_TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      SPRING_AI_MCP_CLIENT_SSE_CONNECTIONS_MCP_SERVER_URL: http://mcp-server:8090/mcp
      # 与 MCP Server 一致的鉴权令牌（app.mcp.auth-token）。
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      # ---- Langfuse 用量报表 / 可观测（用量页必需；OTLP_HEADERS 需为
      #      "Authorization=Basic <base64(pk:sk)>,x-langfuse-ingestion-version=4>"，生成命令见 docs/deploy.md）----
      LANGFUSE_OTLP_ENABLED: ${LANGFUSE_OTLP_ENABLED:-true}
      LANGFUSE_OTLP_ENDPOINT: ${LANGFUSE_OTLP_ENDPOINT:-https://jp.cloud.langfuse.com/api/public/otel}
      LANGFUSE_OTLP_PROTOCOL: ${LANGFUSE_OTLP_PROTOCOL:-http/protobuf}
      LANGFUSE_OTLP_HEADERS: ${LANGFUSE_OTLP_HEADERS:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://jp.cloud.langfuse.com}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    ports:
      - "${APP_PORT:-8080}:8080"
      - "${APP_ADMIN_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

volumes:
  mysql_data:
  redis_data:
  qdrant_data: